name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Fetch all history for tags and branches

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
          check-latest: true

      - name: Determine version
        id: version
        run: |
          # Check if this is a tag build
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # If not a tag, use the latest tag + commit hash
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            LATEST_TAG=${LATEST_TAG#v}  # Remove 'v' prefix if present
            COMMIT_SHORT=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-dev.${COMMIT_SHORT}"
          fi
          
          echo "Determined version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set environment variables
        run: |
          # essa variavel de ambiente sera usada para injetar no ldflags do goreleaser
          echo "GOVERSION=$(go version | cut -d' ' -f3)" >> $GITHUB_ENV

      - uses: sigstore/cosign-installer@v4.1.2 # v3.8.1

      - uses: anchore/sbom-action/download-syft@v0.24.2 # v0.20.10

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: latest
          args: release --clean --snapshot --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}

      - name: Check Binary
        run: |
          ./dist/girus-cli-linux-amd64 help
          ./dist/girus-cli-linux-amd64 version


  build-docker:
    runs-on: ubuntu-latest
    needs: build
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Fetch all history for tags and branches

      - name: Determine version
        id: version
        run: |
          # Check if this is a tag build
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # If not a tag, use the latest tag + commit hash
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            LATEST_TAG=${LATEST_TAG#v}  # Remove 'v' prefix if present
            COMMIT_SHORT=$(git rev-parse --short HEAD)
            VERSION="${LATEST_TAG}-dev.${COMMIT_SHORT}"
          fi
          
          echo "Determined version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Build and push to local registry
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: localhost:5000/girus/girus-cli:latest
          build-args: |
            VERSION=${{ env.VERSION }}

      - name: Inspect
        run: |
          docker run localhost:5000/girus/girus-cli:latest version
